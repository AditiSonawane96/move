# .github/workflows/release.yml
# -----------------------------------------------------------------------------
# Builds MoveNudge for Mac and Windows and attaches the installers to a
# GitHub Release, every time you push a version tag like v1.0.0.
#
# How to make a release (from the movenudge folder):
#   1. Change "version" in package.json, e.g. to 1.0.1
#   2. git commit -am "Release 1.0.1"
#   3. git tag v1.0.1
#   4. git push && git push --tags
# Then watch it run on GitHub, in your repository's "Actions" tab.
# -----------------------------------------------------------------------------

name: Build and release

on:
  push:
    tags:
      - 'v*' # any tag that starts with "v", like v1.0.0

permissions:
  contents: write # lets the workflow create the Release and upload files

jobs:
  # Job 1: build the installers, one computer per system, at the same time.
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the installer
        # "--publish never": just build. The release job below uploads.
        run: npx electron-builder --publish never
        env:
          # We don't have paid signing certificates, so don't look for any.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep the installer for the next job
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  # Job 2: create the GitHub Release and attach both installers.
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
